<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>💖 MNAENCA | إشعارات</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        
    :root{
        --glass:rgba(236,72,153,0.03);
        --border:rgba(236,72,153,0.12);
        --accent:#ec4899;
        --accent2:#f43f5e;
        --bg:#0f0510;
        --card:rgba(236,72,153,0.06);
        --danger:#ef4444;
        --success:#22c55e;
        --warning:#f59e0b;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
        font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        background:var(--bg);
        color:#fff;
        -webkit-tap-highlight-color:transparent;
        user-select:none;
        -webkit-user-select:none;
        height:100vh;overflow:hidden;
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes slideDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
    @keyframes scaleIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(236,72,153,0.3)}50%{box-shadow:0 0 40px rgba(244,63,94,0.7)}}
    .spinner{
        width:36px;height:36px;
        border:3px solid rgba(236,72,153,0.2);
        border-top-color:var(--accent);
        border-radius:50%;
        animation:spin 0.7s linear infinite;
        margin:30px auto;
    }
    .toast-msg{
        position:fixed;bottom:120px;left:50%;transform:translateX(-50%);
        background:rgba(15,5,16,0.95);padding:12px 24px;border-radius:30px;
        z-index:10000;border:1px solid rgba(236,72,153,0.3);font-size:13px;
        opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;
        box-shadow:0 8px 32px rgba(0,0,0,0.4);
    }
    .toast-msg.show{opacity:1}
    .overlay{
        position:fixed;inset:0;background:rgba(15,5,16,0.97);
        backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
        z-index:400;overflow-y:auto;
        animation:fadeIn 0.3s ease;
    }
    .overlay-header{
        display:flex;justify-content:space-between;align-items:center;
        padding:16px 20px;border-bottom:1px solid var(--border);
        position:sticky;top:0;background:rgba(15,5,16,0.9);
        backdrop-filter:blur(20px);z-index:5;
    }
    .overlay-header h3{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
    .btn-close-overlay{
        background:rgba(236,72,153,0.1);border:1px solid var(--border);
        color:#fff;width:36px;height:36px;border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        cursor:pointer;font-size:16px;transition:all 0.3s;
    }
    .btn-close-overlay:hover{background:rgba(236,72,153,0.25);box-shadow:0 0 15px rgba(236,72,153,0.3)}

    /* ✨ RESPONSIVE LAYOUT: Mobile (Vertical) vs Desktop (Horizontal) ✨ */
    
    /* الوضع العمودي (الافتراضي - للموبايل) */
    #mainApp {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        position: relative;
    }

    /* إخفاء عناصر الأفقي في الموبايل */
    .desktop-sidebar { display: none; }
    .desktop-header { display: none; }

    /* --- عند التدوير (أو شاشات أكبر من 800px) --- */
    @media screen and (min-width: 800px) {
        body { overflow: hidden; }
        
        #mainApp {
            flex-direction: row; /* تحويل التخطيط لأفقي */
            height: 100vh;
            width: 100vw;
        }

        /* القائمة الجانبية (الأفقي) */
        .desktop-sidebar {
            display: flex;
            flex-direction: column;
            width: 280px;
            height: 100vh;
            padding: 24px 16px;
            border-right: 1px solid var(--border);
            background: rgba(15,5,16,0.6);
            flex-shrink: 0;
            overflow-y: auto;
        }

        /* تنسيقات القائمة الجانبية */
        .sidebar-logo {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 30px;
            background: linear-gradient(to bottom,#fff,#fbcfe8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 10px;
        }
        .sidebar-nav-item {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 16px; margin-bottom: 6px;
            border-radius: 16px; cursor: pointer;
            font-size: 15px; font-weight: 500;
            color: rgba(255,255,255,0.7);
            transition: all 0.3s;
        }
        .sidebar-nav-item:hover, .sidebar-nav-item.active {
            background: rgba(236,72,153,0.1);
            color: #fff;
        }
        .sidebar-nav-item i { font-size: 20px; width: 24px; text-align: center; }
        
        /* إخفاء الشريط السفلي والشريط العلوي للموبايل في وضع الأفقي */
        .topbar { display: none !important; }
        .nav-bottom { display: none !important; }

        /* ضبط منطقة الفيديوهات لتملأ الشاشة المتبقية */
        .videos-wrap {
            flex: 1;
            height: 100vh;
            width: auto;
        }
        .vid-card video { opacity: 1 !important; transform: translateY(0) !important; }
        
        /* تعديل مساحة العناصر الجانبية للأفقي */
        .side-btns { bottom: 40px; right: 30px; }
        .vid-info { bottom: 40px; left: 30px; right: 90px; }
    }

        body{min-height:100vh;overflow-y:auto}
        .header{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(15,5,16,0.8);backdrop-filter:blur(20px);z-index:10}
        .btn-back{background:rgba(236,72,153,0.1);border:1px solid var(--border);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;font-size:16px}
        .notif-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);align-items:center}
        .notif-icon{width:40px;height:40px;border-radius:50%;background:rgba(236,72,153,0.1);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--accent)}
    </style>
</head>
<body>
<div class="header"><button class="btn-back" onclick="window.location.href='index.html'"><i class="fas fa-arrow-right"></i></button><h2><i class="fas fa-bell"></i> الإشعارات</h2></div>
<div id="notifsList"><div class="spinner"></div></div>
<script src="firebase-config.js"></script>
<script>
    let currentUser=null;
    auth.onAuthStateChanged(async u=>{if(!u){window.location.href='auth.html';return}currentUser=u;loadNotifs()});
    async function loadNotifs(){
        const snap=await db.ref('notifications/'+currentUser.uid).once('value');
        const ns=snap.val()||{};
        const c=document.getElementById('notifsList');
        const items=Object.values(ns).reverse();
        if(!items.length){c.innerHTML='<div style="text-align:center;opacity:0.5;padding:40px"><i class="fas fa-bell" style="font-size:48px;color:#ec4899;margin-bottom:12px;display:block"></i><p>لا توجد إشعارات</p></div>';return}
        c.innerHTML=items.map(n=>`<div class="notif-item"><div class="notif-icon"><i class="fas fa-bell"></i></div><div><div style="font-weight:600">${n.from||'مستخدم'}</div><div style="font-size:12px;opacity:0.6;margin-top:2px">${n.msg||''}</div></div></div>`).join('');
    }
</script>
</body>
</html>
