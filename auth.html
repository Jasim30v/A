<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- ✨ أساسيات SEO و Google اختصار ✨ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>💎 MNAENCA | دخول - فخامة الزمرد</title>
    <meta name="description" content="منصة مناينكا للفخامة - دخول الأعضاء">
    <meta name="theme-color" content="#05140b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MNAENCA">
    <link rel="manifest" href="data:application/json,{}"> <!-- رابط اختصار لتطبيق الويب -->

    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <!-- أيقونات Font Awesome الحديثة -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Service Worker للـ PWA (اختياري) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("data:application/javascript," + encodeURIComponent(
                    "self.addEventListener('fetch', e => {})"
                )).catch(() => {});
            });
        }
    </script>

    <style>
        :root {
            --glass: rgba(16, 185, 129, 0.03);
            --border: rgba(16, 185, 129, 0.12);
            --accent: #10b981;
            --accent2: #34d399;
            --bg: #05140b;
            --card: rgba(16, 185, 129, 0.06);
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            min-height: 100vh;
            background: radial-gradient(ellipse at top, #0f172a, #05140b, #020617);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 20px;
        }

        /* ✨ تأثيرات الخلفية الديناميكية ✨ */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.25;
            animation: orbFloat 20s infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        .bg-orb:nth-child(1) { width: 400px; height: 400px; background: #10b981; top: -100px; left: -100px; }
        .bg-orb:nth-child(2) { width: 350px; height: 350px; background: #34d399; bottom: -100px; right: -100px; animation-delay: 5s; }
        .bg-orb:nth-child(3) { width: 300px; height: 300px; background: #a7f3d0; top: 50%; left: 50%; animation-delay: 10s; }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -50px) scale(1.3); }
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes glowPulse { 0%, 100% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); } 50% { box-shadow: 0 0 40px rgba(52, 211, 153, 0.7); } }

        /* 🎴 البطاقة الرئيسية 🎴 */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(16, 185, 129, 0.03);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 32px;
            padding: 36px 28px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 30px 70px rgba(16, 185, 129, 0.1), inset 0 0 30px rgba(16, 185, 129, 0.02);
            animation: fadeUp 0.8s ease;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(52, 211, 153, 0.3));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            animation: glowPulse 3s ease-in-out infinite;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            letter-spacing: 2px;
        }

        .sub {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* 🔘 الأزرار والتبويبات 🔘 */
        .tabs {
            display: flex;
            gap: 4px;
            background: rgba(16, 185, 129, 0.06);
            border-radius: 40px;
            padding: 4px;
            margin-bottom: 24px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            border-radius: 40px;
            font-size: 14px;
            transition: all 0.3s;
            font-weight: 500;
        }
        .tab.active {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: #fff;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .form {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .form.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        input {
            width: 100%;
            padding: 15px 18px;
            margin: 8px 0;
            border-radius: 50px;
            background: rgba(16, 185, 129, 0.04);
            border: 1px solid rgba(16, 185, 129, 0.15);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.4s;
        }
        input:focus {
            border-color: rgba(16, 185, 129, 0.6);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
            background: rgba(16, 185, 129, 0.08);
        }
        input::placeholder { color: rgba(255, 255, 255, 0.3); }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 18px;
            background: linear-gradient(135deg, #10b981, #34d399);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 20px 40px rgba(16, 185, 129, 0.6); }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.6; pointer-events: none; transform: none; }

        .msg {
            text-align: center;
            color: #fca5a5;
            font-size: 13px;
            margin-top: 14px;
            min-height: 20px;
            font-weight: 500;
        }
        .msg.success { color: #4ade80; }
    </style>
</head>
<body>
    <!-- كرات الخلفية الزمردية -->
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>

    <div class="card">
        <div class="logo">💎</div>
        <h1>MNAENCA</h1>
        <p class="sub"><i class="fas fa-gem"></i> فخامة الزمرد الأخضر 2026 ✨</p>

        <div class="tabs">
            <button class="tab active" id="tabLogin" onclick="switchTab('login')"><i class="fas fa-sign-in-alt"></i> دخول</button>
            <button class="tab" id="tabRegister" onclick="switchTab('register')"><i class="fas fa-user-plus"></i> اشتراك</button>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <div id="formLogin" class="form active">
            <input type="email" id="loginEmail" placeholder="📧 البريد الإلكتروني" autocomplete="email" dir="ltr">
            <input type="password" id="loginPass" placeholder="🔒 كلمة المرور" autocomplete="current-password">
            <button id="btnLogin" onclick="doLogin()"><i class="fas fa-arrow-right-to-bracket"></i> تسجيل الدخول</button>
            <div class="msg" id="loginMsg"></div>
        </div>

        <!-- نموذج إنشاء الحساب -->
        <div id="formRegister" class="form">
            <input type="text" id="regName" placeholder="👤 اسم المستخدم" autocomplete="username">
            <input type="email" id="regEmail" placeholder="📧 البريد الإلكتروني" autocomplete="email" dir="ltr">
            <input type="password" id="regPass" placeholder="🔒 كلمة المرور (6 أحرف على الأقل)" autocomplete="new-password">
            <button id="btnRegister" onclick="doRegister()"><i class="fas fa-heart"></i> إنشاء حساب</button>
            <div class="msg" id="regMsg"></div>
        </div>
    </div>

    <!-- يجب أن يكون لديك ملف firebase-config.js في نفس المجلد -->
    <script src="firebase-config.js"></script>
    <script>
        // تبديل التبويبات
        function switchTab(type) {
            document.getElementById('tabLogin').classList.remove('active');
            document.getElementById('tabRegister').classList.remove('active');
            document.getElementById('formLogin').classList.remove('active');
            document.getElementById('formRegister').classList.remove('active');
            document.getElementById('loginMsg').innerText = '';
            document.getElementById('regMsg').innerText = '';
            
            if (type === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('formLogin').classList.add('active');
            } else {
                document.getElementById('tabRegister').classList.add('active');
                document.getElementById('formRegister').classList.add('active');
            }
        }

        // دالة تسجيل الدخول
        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value;
            const msg = document.getElementById('loginMsg');
            const btn = document.getElementById('btnLogin');
            
            if (!email || !password) {
                msg.innerText = '❌ الرجاء ملء جميع الحقول';
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري الدخول...';
            msg.innerText = '';
            msg.className = 'msg';
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                window.location.replace('index.html');
            } catch (error) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> تسجيل الدخول';
                switch (error.code) {
                    case 'auth/user-not-found': msg.innerText = '❌ لا يوجد حساب بهذا البريد'; break;
                    case 'auth/wrong-password': case 'auth/invalid-credential': msg.innerText = '❌ كلمة المرور غير صحيحة'; break;
                    case 'auth/invalid-email': msg.innerText = '❌ بريد إلكتروني غير صالح'; break;
                    case 'auth/too-many-requests': msg.innerText = '❌ محاولات كثيرة، حاول لاحقاً'; break;
                    default: msg.innerText = '❌ خطأ: ' + error.message;
                }
            }
        }

        // دالة إنشاء الحساب
        async function doRegister() {
            const username = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPass').value;
            const msg = document.getElementById('regMsg');
            const btn = document.getElementById('btnRegister');
            
            if (!username || !email || !password) {
                msg.innerText = '❌ الرجاء ملء جميع الحقول';
                return;
            }
            if (username.length < 3) {
                msg.innerText = '❌ اسم المستخدم 3 أحرف على الأقل';
                return;
            }
            if (password.length < 6) {
                msg.innerText = '❌ كلمة المرور 6 أحرف على الأقل';
                return;
            }
            if (!email.includes('@') || !email.includes('.')) {
                msg.innerText = '❌ بريد إلكتروني غير صالح';
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري إنشاء الحساب...';
            msg.innerText = '';
            msg.className = 'msg';
            
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const uid = userCredential.user.uid;
                const avatarUrl = 'https://api.dicebear.com/7.x/bottts/svg?seed=' + uid;
                const coverColor = ['#10b981', '#059669', '#047857', '#34d399', '#a7f3d0'][Math.floor(Math.random() * 5)];
                
                const userData = {
                    username: username,
                    email: email,
                    bio: '',
                    website: '',
                    location: '',
                    contactEmail: '',
                    avatarUrl: avatarUrl,
                    hasCustomAvatar: false,
                    coverImageUrl: '',
                    hasCustomCover: false,
                    coverColor: coverColor,
                    followers: {},
                    following: {},
                    totalLikes: 0,
                    totalPosts: 0,
                    isVerified: false,
                    verifiedAt: null,
                    verifiedBy: null,
                    banned: false,
                    createdAt: Date.now(),
                    lastSeen: Date.now()
                };
                
                await db.ref('users/' + uid).set(userData);
                msg.innerText = '✅ تم إنشاء الحساب بنجاح! جاري التوجيه...';
                msg.className = 'msg success';
                setTimeout(() => { window.location.replace('index.html'); }, 800);
            } catch (error) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-heart"></i> إنشاء حساب';
                msg.className = 'msg';
                switch (error.code) {
                    case 'auth/email-already-in-use': msg.innerText = '❌ البريد الإلكتروني مستخدم بالفعل'; break;
                    case 'auth/weak-password': msg.innerText = '❌ كلمة المرور ضعيفة جداً'; break;
                    case 'auth/invalid-email': msg.innerText = '❌ بريد إلكتروني غير صالح'; break;
                    case 'auth/operation-not-allowed': msg.innerText = '❌ التسجيل غير مفعل، راجع إعدادات Firebase'; break;
                    default: msg.innerText = '❌ خطأ: ' + (error.message || 'غير معروف');
                }
            }
        }

        // دعم الضغط على Enter
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (document.getElementById('formLogin').classList.contains('active')) {
                        doLogin();
                    } else {
                        doRegister();
                    }
                }
            });
        });

        // توجيه المستخدم إذا كان مسجل الدخول بالفعل
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.replace('index.html');
            }
        });

        console.log('💎 MNAENCA - واجهة الدخول الفاخرة جاهزة');
    </script>
</body>
</html>
