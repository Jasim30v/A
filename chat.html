<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>💎 MNAENCA | دردشة</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--accent:#10b981;--accent2:#059669;--border:rgba(16,185,129,0.2);--bg-dark:#05140b}
        body{height:100vh;height:100dvh;display:flex;flex-direction:column;background:#05140b;overflow:hidden;font-family:'Segoe UI',Tahoma,sans-serif;color:#fff}
        .spinner{width:44px;height:44px;border:4px solid rgba(16,185,129,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes pulse-record{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.5)}50%{box-shadow:0 0 0 14px rgba(239,68,68,0)}}
        .toast-msg{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 28px;border-radius:50px;font-size:14px;font-weight:600;backdrop-filter:blur(10px);border:1px solid rgba(16,185,129,0.3);pointer-events:none;opacity:0;transition:all 0.4s cubic-bezier(0.16,1,0.3,1);z-index:999}
        .toast-msg.show{opacity:1;bottom:40px}
        .header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:rgba(5,20,11,0.9);backdrop-filter:blur(20px);flex-shrink:0;z-index:10}
        .btn-back{background:rgba(16,185,129,0.1);border:1px solid var(--border);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;font-size:16px;text-decoration:none;flex-shrink:0;transition:all 0.3s}
        .btn-back:hover{background:rgba(16,185,129,0.25)}
        .header-title{flex:1;min-width:0}
        .header h2{font-size:16px;font-weight:700}
        .header h2 i{color:var(--accent);margin-left:6px}
        .conv-list{flex:1;overflow-y:auto;padding:8px 0}
        .conv-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(16,185,129,0.06);cursor:pointer;transition:background 0.2s;animation:fadeIn 0.3s ease}
        .conv-item:hover{background:rgba(16,185,129,0.04)}
        .chat-avatar{width:50px;height:50px;border-radius:50%;overflow:hidden;border:2px solid rgba(16,185,129,0.3);flex-shrink:0;background:rgba(16,185,129,0.1)}
        .chat-avatar img{width:100%;height:100%;object-fit:cover}
        .conv-info{flex:1;min-width:0}
        .conv-name{font-weight:600;font-size:15px;margin-bottom:3px;display:flex;align-items:center;gap:6px}
        .conv-last{font-size:12px;color:rgba(255,255,255,0.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .chat-msgs{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:8px;background:#030d07;scroll-behavior:smooth}
        .bubble{max-width:80%;padding:10px 16px;border-radius:20px;word-break:break-word;font-size:14px;position:relative;animation:msgIn 0.35s cubic-bezier(0.16,1,0.3,1);line-height:1.5}
        .bubble.sent{background:linear-gradient(135deg,var(--accent),var(--accent2));align-self:flex-end;color:#fff;border-bottom-right-radius:6px;box-shadow:0 4px 15px rgba(16,185,129,0.2)}
        .bubble.received{background:rgba(16,185,129,0.08);align-self:flex-start;border:1px solid rgba(16,185,129,0.12);border-bottom-left-radius:6px}
        .bubble img{max-width:200px;border-radius:14px;cursor:pointer;margin-top:6px;display:block}
        .bubble audio{margin-top:6px;width:200px;height:36px;border-radius:18px;outline:none}
        .bubble .time{font-size:9px;opacity:0.5;margin-top:6px;text-align:left;direction:ltr}
        .bubble .copy-msg-btn{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;transition:all 0.2s;z-index:5}
        .bubble:hover .copy-msg-btn{display:flex}
        .bubble .copy-msg-btn:hover{background:var(--accent);border-color:var(--accent)}
        .input-bar{display:flex;gap:8px;padding:10px 12px;background:rgba(5,20,11,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(16,185,129,0.2);align-items:center;flex-shrink:0;z-index:10;min-height:60px;position:relative}
        .input-bar input{flex:1;padding:12px 18px;border-radius:30px;background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.25);color:#fff;font-size:14px;outline:none;transition:all 0.3s;min-width:0}
        .input-bar input:focus{border-color:var(--accent);box-shadow:0 0 15px rgba(16,185,129,0.15);background:rgba(16,185,129,0.1)}
        .input-bar input::placeholder{color:rgba(255,255,255,0.35)}
        .btn-icon{width:42px;height:42px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);border-radius:50%;color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.3s}
        .btn-icon:hover{background:rgba(16,185,129,0.25);border-color:var(--accent)}
        .btn-send{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:50%;color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 20px rgba(16,185,129,0.4);transition:all 0.3s}
        .btn-send:hover{transform:scale(1.05);box-shadow:0 8px 25px rgba(16,185,129,0.6)}
        .btn-send:active{transform:scale(0.95)}
        .btn-record{width:42px;height:42px;background:rgba(239,68,68,0.2);border:2px solid rgba(239,68,68,0.5);border-radius:50%;color:#ef4444;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.3s}
        .btn-record.recording{animation:pulse-record 1s infinite;background:rgba(239,68,68,0.4);border-color:#ef4444}
        .recording-timer{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#ef4444;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;display:none}
        .recording-timer.active{display:block}
        .empty-state{text-align:center;padding:50px 20px;color:rgba(255,255,255,0.4)}
        .empty-state i{font-size:60px;color:var(--accent);opacity:0.3;margin-bottom:16px;display:block}
        .empty-state p{font-size:15px;margin-bottom:6px}
        .empty-state span{font-size:12px;opacity:0.5}
        .chat-header-info{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
        .chat-header-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid rgba(16,185,129,0.3);flex-shrink:0}
        .chat-header-avatar img{width:100%;height:100%;object-fit:cover}
    </style>
</head>
<body>

<div id="loader" style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px">
    <div class="spinner"></div>
    <span style="color:rgba(255,255,255,0.5)">💎 جاري تحميل الدردشة...</span>
</div>

<div id="convView" style="display:none;flex:1;flex-direction:column;overflow:hidden">
    <div class="header">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-right"></i></a>
        <div class="header-title"><h2><i class="fas fa-comments"></i> المحادثات</h2></div>
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="empty-state" id="convEmpty" style="display:none">
        <i class="fas fa-comment-slash"></i><p>لا توجد محادثات</p><span>ابدأ محادثة من ملف المستخدم</span>
    </div>
</div>

<div id="chatView" style="display:none;flex:1;flex-direction:column;overflow:hidden">
    <div class="header">
        <button class="btn-back" onclick="showConvs()"><i class="fas fa-arrow-right"></i></button>
        <div class="chat-header-info">
            <div class="chat-header-avatar" id="chatAvatar"><img src="" alt=""></div>
            <div style="flex:1;min-width:0">
                <div style="font-weight:700;font-size:15px" id="chatName">محادثة</div>
                <div style="font-size:11px;opacity:0.5" id="chatOnline"></div>
            </div>
        </div>
        <button class="btn-icon" onclick="copyChat()" title="نسخ المحادثة كاملة"><i class="fas fa-copy"></i></button>
    </div>
    <div class="chat-msgs" id="msgsList">
        <div class="empty-state"><i class="fas fa-comments"></i><p>ابدأ المحادثة</p><span>أرسل رسالة للبدء 💎</span></div>
    </div>
    <div class="input-bar">
        <span class="recording-timer" id="recTimer">00:00</span>
        <button class="btn-icon" onclick="sendImage()" title="إرسال صورة"><i class="fas fa-image"></i></button>
        <button class="btn-record" id="btnRecord" onclick="toggleRecording()" title="تسجيل صوتي"><i class="fas fa-microphone"></i></button>
        <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..." autocomplete="off" onkeydown="if(event.key==='Enter')sendMsg()">
        <button class="btn-send" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<div class="toast-msg" id="toastMsg">✅ تم</div>

<script src="firebase-config.js"></script>
<script>
const DICEBEAR_URL='https://api.dicebear.com/7.x/avataaars/svg';
let currentUser=null,allUsers={},chatUserId=null;
let mediaRecorder=null,audioChunks=[],recordingStartTime=null,recordingTimerInterval=null,isRecording=false;

auth.onAuthStateChanged(async u=>{
    if(!u){window.location.href='auth.html';return}
    currentUser=u;
    const us=await db.ref('users').once('value');
    allUsers=us.val()||{};
    document.getElementById('loader').style.display='none';
    const params=new URLSearchParams(window.location.search);
    const targetUid=params.get('uid');
    if(targetUid){openChat(targetUid)}else{showConvs()}
    setInterval(()=>{if(currentUser)db.ref('users/'+currentUser.uid+'/lastSeen').set(Date.now())},60000)
});

function showConvs(){
    document.getElementById('chatView').style.display='none';
    document.getElementById('convView').style.display='flex';
    chatUserId=null;loadConvs()
}

async function loadConvs(){
    const cl=document.getElementById('convList');
    const ce=document.getElementById('convEmpty');
    cl.innerHTML='';
    const snap=await db.ref('private_messages').once('value');
    const all=snap.val()||{};
    const found=new Set();
    Object.keys(all).forEach(cid=>{
        const[u1,u2]=cid.split('_');
        const other=u1===currentUser.uid?u2:u2===currentUser.uid?u1:null;
        if(other&&!found.has(other)&&allUsers[other])found.add(other)
    });
    if(!found.size){ce.style.display='block';return}else{ce.style.display='none'}
    found.forEach(uid=>{
        const u=allUsers[uid];
        const d=document.createElement('div');
        d.className='conv-item';
        d.innerHTML='<div class="chat-avatar"><img src="'+(u?.avatarUrl||(DICEBEAR_URL+'?seed='+uid))+'" alt="" onerror="this.src=''+DICEBEAR_URL+'?seed='+uid+''"></div><div class="conv-info"><div class="conv-name">@'+(u?.username||'مستخدم')+' '+(u?.isVerified?'<span style="color:#a7f3d0;font-size:12px"><i class="fas fa-check-circle"></i></span>':'')+'</div><div class="conv-last">اضغط للدخول إلى المحادثة 💬</div></div>';
        d.onclick=()=>openChat(uid);
        cl.appendChild(d)
    })
}

async function openChat(uid){
    chatUserId=uid;
    const u=allUsers[uid];
    document.getElementById('chatName').innerText='@'+(u?.username||'مستخدم');
    document.getElementById('chatAvatar').querySelector('img').src=u?.avatarUrl||(DICEBEAR_URL+'?seed='+uid);
    document.getElementById('convView').style.display='none';
    document.getElementById('chatView').style.display='flex';
    const onlineEl=document.getElementById('chatOnline');
    db.ref('presence/'+uid).on('value',s=>{
        const online=s.val();
        onlineEl.innerHTML=online?'<span style="color:#22c55e">● نشط الآن</span>':'آخر ظهور: '+formatTime(u?.lastSeen)
    });
    await loadMsgs();
    document.getElementById('msgInput').focus()
}

function getChatId(){return[currentUser.uid,chatUserId].sort().join('_')}

async function loadMsgs(){
    const ml=document.getElementById('msgsList');
    if(!chatUserId)return;
    const snap=await db.ref('private_messages/'+getChatId()).once('value');
    const ms=snap.val()||{};
    const msgsArr=Object.values(ms).sort((a,b)=>a.timestamp-b.timestamp);
    if(!msgsArr.length){
        ml.innerHTML='<div class="empty-state"><i class="fas fa-comments"></i><p>ابدأ المحادثة</p><span>أرسل رسالة للبدء 💎</span></div>';
        return
    }
    ml.innerHTML=msgsArr.map(m=>{
        const sent=m.senderId===currentUser.uid;
        let content='';
        if(m.type==='image'){
            content='<img src="'+m.imageUrl+'" onclick="window.open(''+m.imageUrl+'','_blank')" loading="lazy">';
        }else if(m.type==='voice'){
            content='<audio controls src="'+m.voiceUrl+'"></audio>';
        }else{
            content=m.text;
        }
        const msgData=encodeURIComponent(JSON.stringify(m));
        return '<div class="bubble '+(sent?'sent':'received')+'" data-msg=''+msgData+''><button class="copy-msg-btn" onclick="copySingleMsg(this)" title="نسخ الرسالة"><i class="fas fa-copy"></i></button>'+content+'<div class="time">'+new Date(m.timestamp).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'})+'</div></div>';
    }).join('');
    setTimeout(()=>{ml.scrollTop=ml.scrollHeight},100)
}

async function sendMsg(){
    const inp=document.getElementById('msgInput');
    const txt=inp.value.trim();
    if(!txt||!chatUserId)return;
    inp.value='';
    await db.ref('private_messages/'+getChatId()).push({senderId:currentUser.uid,text:txt,type:'text',timestamp:Date.now()});
    await loadMsgs()
}

async function sendImage(){
    if(!chatUserId)return;
    const inp=document.createElement('input');
    inp.type='file';inp.accept='image/*';
    inp.onchange=async(e)=>{
        const file=e.target.files[0];
        if(!file)return;
        showToast('⏳ جاري رفع الصورة...');
        const fd=new FormData();
        fd.append('file',file);
        fd.append('upload_preset',UPLOAD_PRESET);
        try{
            const res=await fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/image/upload',{method:'POST',body:fd});
            const data=await res.json();
            if(data.secure_url){
                await db.ref('private_messages/'+getChatId()).push({senderId:currentUser.uid,type:'image',imageUrl:data.secure_url,timestamp:Date.now()});
                await loadMsgs();
                showToast('✅ تم إرسال الصورة')
            }
        }catch(e){showToast('❌ فشل رفع الصورة')}
    };
    inp.click()
}

// ========== 🎙️ تسجيل صوتي ==========
async function toggleRecording(){
    if(isRecording){stopRecording()}else{startRecording()}
}

async function startRecording(){
    if(!chatUserId){showToast('⚠️ افتح محادثة أولاً');return}
    try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        mediaRecorder=new MediaRecorder(stream,{mimeType:'audio/webm'});
        audioChunks=[];
        mediaRecorder.ondataavailable=(e)=>{if(e.data.size>0)audioChunks.push(e.data)};
        mediaRecorder.onstop=async()=>{
            const audioBlob=new Blob(audioChunks,{type:'audio/webm'});
            await uploadVoice(audioBlob);
            stream.getTracks().forEach(track=>track.stop())
        };
        mediaRecorder.start();
        isRecording=true;
        recordingStartTime=Date.now();
        const btnRecord=document.getElementById('btnRecord');
        btnRecord.classList.add('recording');
        btnRecord.innerHTML='<i class="fas fa-stop"></i>';
        document.getElementById('recTimer').classList.add('active');
        updateRecordingTimer();
        recordingTimerInterval=setInterval(updateRecordingTimer,1000);
        showToast('🎙️ جاري التسجيل...')
    }catch(err){showToast('❌ لا يمكن الوصول للميكروفون')}
}

function stopRecording(){
    if(mediaRecorder&&mediaRecorder.state==='recording'){
        mediaRecorder.stop();
        isRecording=false;
        const btnRecord=document.getElementById('btnRecord');
        btnRecord.classList.remove('recording');
        btnRecord.innerHTML='<i class="fas fa-microphone"></i>';
        document.getElementById('recTimer').classList.remove('active');
        clearInterval(recordingTimerInterval);
        showToast('✅ تم إيقاف التسجيل')
    }
}

function updateRecordingTimer(){
    const elapsed=Math.floor((Date.now()-recordingStartTime)/1000);
    const mins=Math.floor(elapsed/60).toString().padStart(2,'0');
    const secs=(elapsed%60).toString().padStart(2,'0');
    document.getElementById('recTimer').innerText=mins+':'+secs
}

async function uploadVoice(audioBlob){
    if(!chatUserId)return;
    showToast('⏳ جاري رفع التسجيل الصوتي...');
    const fd=new FormData();
    fd.append('file',audioBlob,'voice_'+Date.now()+'.webm');
    fd.append('upload_preset',UPLOAD_PRESET);
    try{
        const res=await fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/video/upload',{method:'POST',body:fd});
        const data=await res.json();
        if(data.secure_url){
            await db.ref('private_messages/'+getChatId()).push({senderId:currentUser.uid,type:'voice',voiceUrl:data.secure_url,timestamp:Date.now()});
            await loadMsgs();
            showToast('✅ تم إرسال التسجيل الصوتي')
        }
    }catch(e){showToast('❌ فشل رفع التسجيل الصوتي')}
}

// ========== 📋 نسخ ==========
function copySingleMsg(btn){
    const bubble=btn.closest('.bubble');
    const encodedMsg=bubble.getAttribute('data-msg');
    if(!encodedMsg)return;
    try{
        const msg=JSON.parse(decodeURIComponent(encodedMsg));
        let textToCopy='';
        if(msg.type==='text')textToCopy=msg.text;
        else if(msg.type==='image')textToCopy=msg.imageUrl;
        else if(msg.type==='voice')textToCopy=msg.voiceUrl;
        copyToClipboard(textToCopy);
        showToast('✅ تم نسخ الرسالة')
    }catch(e){}
}

async function copyChat(){
    if(!chatUserId)return;
    const snap=await db.ref('private_messages/'+getChatId()).once('value');
    const msgs=snap.val()||{};
    let text='💬 محادثة MNAENCA\n'+'─'.repeat(30)+'\n';
    Object.values(msgs).sort((a,b)=>a.timestamp-b.timestamp).forEach(m=>{
        const sender=m.senderId===currentUser.uid?'أنت':(allUsers[m.senderId]?.username||'مستخدم');
        let content=m.text||'';
        if(m.type==='image')content='[📷 صورة] '+m.imageUrl;
        else if(m.type==='voice')content='[🎙️ تسجيل صوتي] '+m.voiceUrl;
        const time=new Date(m.timestamp).toLocaleTimeString('ar-SA');
        text+='\n'+sender+' ('+time+'):\n'+content+'\n'
    });
    await copyToClipboard(text);
    showToast('✅ تم نسخ المحادثة كاملة')
}

async function copyToClipboard(text){
    try{await navigator.clipboard.writeText(text)}
    catch(e){
        const ta=document.createElement('textarea');
        ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
        document.body.appendChild(ta);ta.select();
        document.execCommand('copy');document.body.removeChild(ta)
    }
}

function showToast(msg){
    const toast=document.getElementById('toastMsg');
    toast.innerText=msg;toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout=setTimeout(()=>toast.classList.remove('show'),2500)
}

function formatTime(ts){
    if(!ts)return'غير معروف';
    const diff=Date.now()-ts;
    const mins=Math.floor(diff/60000);
    const hours=Math.floor(diff/3600000);
    const days=Math.floor(diff/86400000);
    if(mins<1)return'الآن';
    if(mins<60)return'منذ '+mins+' د';
    if(hours<24)return'منذ '+hours+' س';
    if(days<7)return'منذ '+days+' يوم';
    return new Date(ts).toLocaleDateString('ar-SA')
}

console.log('💎 MNAENCA Chat Pro Ready ✨');
</script>
</body>
</html>
