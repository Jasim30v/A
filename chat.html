<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>💖 MNAENCA | دردشة</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root{
            --glass:rgba(236,72,153,0.03);
            --border:rgba(236,72,153,0.12);
            --accent:#ec4899;
            --accent2:#f43f5e;
            --bg:#0f0510;
            --card:rgba(236,72,153,0.06);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background:var(--bg);
            color:#fff;
            height:100vh;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }

        /* ✅ HEADER */
        .header{
            display:flex;
            align-items:center;
            gap:12px;
            padding:12px 16px;
            background:rgba(15,5,16,0.95);
            backdrop-filter:blur(20px);
            border-bottom:1px solid var(--border);
            z-index:10;
            flex-shrink:0;
        }
        .btn-back{
            background:rgba(236,72,153,0.15);
            border:1px solid var(--border);
            width:38px;height:38px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            cursor:pointer;
            font-size:16px;
            transition:all 0.3s;
        }
        .btn-back:hover{
            background:rgba(236,72,153,0.3);
            box-shadow:0 0 15px rgba(236,72,153,0.3);
        }
        .chat-avatar{
            width:42px;height:42px;
            border-radius:50%;
            overflow:hidden;
            border:2px solid rgba(236,72,153,0.4);
            flex-shrink:0;
        }
        .chat-avatar img{
            width:100%;height:100%;
            object-fit:cover;
        }
        .chat-info{
            flex:1;
            min-width:0;
        }
        .chat-info h3{
            font-size:15px;
            font-weight:700;
            color:#fff;
        }
        .chat-info .status{
            font-size:11px;
            opacity:0.6;
            display:flex;
            align-items:center;
            gap:4px;
        }
        .online-indicator{
            width:8px;height:8px;
            background:#22c55e;
            border-radius:50%;
            display:inline-block;
        }

        /* ✅ MESSAGES AREA */
        .messages-area{
            flex:1;
            overflow-y:auto;
            padding:16px;
            display:flex;
            flex-direction:column;
            gap:8px;
            background:radial-gradient(ellipse at top, rgba(236,72,153,0.03), transparent);
        }
        .messages-area::-webkit-scrollbar{
            width:4px;
        }
        .messages-area::-webkit-scrollbar-track{
            background:transparent;
        }
        .messages-area::-webkit-scrollbar-thumb{
            background:rgba(236,72,153,0.2);
            border-radius:4px;
        }

        /* ✅ MESSAGE BUBBLES */
        .msg-wrapper{
            display:flex;
            animation:msgIn 0.3s ease;
        }
        .msg-wrapper.sent{
            justify-content:flex-end;
        }
        .msg-wrapper.received{
            justify-content:flex-start;
        }
        @keyframes msgIn{
            from{opacity:0;transform:translateY(15px)}
            to{opacity:1;transform:translateY(0)}
        }

        .bubble{
            max-width:75%;
            padding:12px 16px;
            border-radius:20px;
            word-break:break-word;
            font-size:14px;
            line-height:1.5;
            position:relative;
        }
        .bubble.sent{
            background:linear-gradient(135deg, #ec4899, #f43f5e);
            color:#fff;
            border-bottom-right-radius:4px;
            box-shadow:0 4px 15px rgba(236,72,153,0.3);
        }
        .bubble.received{
            background:rgba(236,72,153,0.08);
            border:1px solid rgba(236,72,153,0.15);
            color:#fff;
            border-bottom-left-radius:4px;
            backdrop-filter:blur(10px);
        }
        .bubble .time{
            font-size:10px;
            opacity:0.6;
            margin-top:6px;
            text-align:left;
        }
        .bubble img{
            max-width:220px;
            border-radius:12px;
            cursor:pointer;
            display:block;
            transition:transform 0.2s;
        }
        .bubble img:hover{
            transform:scale(1.02);
        }
        .bubble .voice-msg{
            display:flex;
            align-items:center;
            gap:10px;
            min-width:150px;
        }
        .bubble .voice-msg audio{
            height:40px;
            border-radius:20px;
        }
        .bubble .voice-duration{
            font-size:11px;
            opacity:0.7;
            white-space:nowrap;
        }

        /* ✅ IMAGE PREVIEW MODAL */
        .image-preview-overlay{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.95);
            z-index:1000;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            animation:fadeIn 0.3s ease;
        }
        .image-preview-overlay img{
            max-width:95%;
            max-height:90vh;
            border-radius:12px;
            box-shadow:0 20px 60px rgba(236,72,153,0.3);
        }
        @keyframes fadeIn{
            from{opacity:0}
            to{opacity:1}
        }

        /* ✅ INPUT BAR - مستطيل الكتابة */
        .input-container{
            padding:12px 16px;
            background:rgba(15,5,16,0.98);
            backdrop-filter:blur(30px);
            border-top:2px solid rgba(236,72,153,0.2);
            flex-shrink:0;
            box-shadow:0 -8px 32px rgba(236,72,153,0.08);
        }
        .input-row{
            display:flex;
            align-items:center;
            gap:10px;
        }

        /* ✅ زر التسجيل الصوتي */
        .btn-voice{
            width:44px;
            height:44px;
            border-radius:50%;
            background:rgba(236,72,153,0.1);
            border:1.5px solid rgba(236,72,153,0.3);
            color:#fbcfe8;
            cursor:pointer;
            font-size:18px;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:all 0.3s;
            flex-shrink:0;
            position:relative;
        }
        .btn-voice:hover{
            background:rgba(236,72,153,0.2);
            box-shadow:0 0 20px rgba(236,72,153,0.4);
            transform:scale(1.05);
        }
        .btn-voice.recording{
            background:#ef4444;
            border-color:#ef4444;
            animation:pulse 1s infinite;
            box-shadow:0 0 30px rgba(239,68,68,0.6);
        }
        @keyframes pulse{
            0%,100%{box-shadow:0 0 10px rgba(239,68,68,0.4)}
            50%{box-shadow:0 0 30px rgba(239,68,68,0.8)}
        }
        .recording-timer{
            position:absolute;
            top:-25px;
            left:50%;
            transform:translateX(-50%);
            background:rgba(0,0,0,0.8);
            color:#ef4444;
            padding:3px 10px;
            border-radius:12px;
            font-size:11px;
            font-weight:700;
            white-space:nowrap;
            display:none;
        }
        .btn-voice.recording .recording-timer{
            display:block;
        }

        /* ✅ مستطيل الكتابة */
        .message-input{
            flex:1;
            padding:12px 18px;
            border-radius:25px;
            background:rgba(236,72,153,0.04);
            border:1.5px solid rgba(236,72,153,0.2);
            color:#fff;
            font-size:14px;
            outline:none;
            transition:all 0.3s;
            min-width:0;
        }
        .message-input:focus{
            border-color:rgba(236,72,153,0.5);
            background:rgba(236,72,153,0.08);
            box-shadow:0 0 20px rgba(236,72,153,0.15);
        }
        .message-input::placeholder{
            color:rgba(255,255,255,0.35);
        }

        /* ✅ زر إرسال الصور */
        .btn-image{
            width:44px;
            height:44px;
            border-radius:50%;
            background:rgba(236,72,153,0.1);
            border:1.5px solid rgba(236,72,153,0.3);
            color:#fbcfe8;
            cursor:pointer;
            font-size:18px;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:all 0.3s;
            flex-shrink:0;
        }
        .btn-image:hover{
            background:rgba(236,72,153,0.2);
            box-shadow:0 0 20px rgba(236,72,153,0.4);
            transform:scale(1.05);
        }

        /* ✅ زر الإرسال */
        .btn-send{
            width:48px;
            height:48px;
            border-radius:50%;
            background:linear-gradient(135deg, #ec4899, #f43f5e);
            border:none;
            color:#fff;
            cursor:pointer;
            font-size:18px;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:all 0.3s;
            flex-shrink:0;
            box-shadow:0 6px 20px rgba(236,72,153,0.4);
        }
        .btn-send:hover{
            transform:scale(1.08);
            box-shadow:0 10px 30px rgba(236,72,153,0.6);
        }
        .btn-send:active{
            transform:scale(0.95);
        }

        /* ✅ معاينة الصورة قبل الإرسال */
        .image-preview-bar{
            display:none;
            padding:8px 16px;
            background:rgba(236,72,153,0.05);
            border-top:1px solid var(--border);
            align-items:center;
            gap:10px;
        }
        .image-preview-bar.show{
            display:flex;
        }
        .image-preview-bar img{
            width:50px;
            height:50px;
            object-fit:cover;
            border-radius:10px;
            border:2px solid rgba(236,72,153,0.3);
        }
        .image-preview-bar .preview-info{
            flex:1;
            font-size:12px;
            opacity:0.7;
        }
        .image-preview-bar .btn-cancel-preview{
            background:rgba(239,68,68,0.2);
            border:1px solid rgba(239,68,68,0.3);
            color:#f87171;
            width:32px;height:32px;
            border-radius:50%;
            cursor:pointer;
            font-size:14px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        /* ✅ قائمة المحادثات */
        .conv-item{
            display:flex;
            align-items:center;
            gap:12px;
            padding:14px 16px;
            border-bottom:1px solid var(--border);
            cursor:pointer;
            transition:all 0.2s;
        }
        .conv-item:hover{
            background:rgba(236,72,153,0.06);
        }
        .conv-avatar{
            width:48px;height:48px;
            border-radius:50%;
            overflow:hidden;
            border:2px solid rgba(236,72,153,0.3);
            flex-shrink:0;
        }
        .conv-avatar img{
            width:100%;height:100%;
            object-fit:cover;
        }
        .conv-info{
            flex:1;
            min-width:0;
        }
        .conv-info h4{
            font-size:14px;
            font-weight:600;
        }
        .conv-info p{
            font-size:12px;
            opacity:0.5;
            margin-top:2px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        /* ✅ TOAST */
        .toast-msg{
            position:fixed;
            bottom:120px;
            left:50%;
            transform:translateX(-50%);
            background:rgba(15,5,16,0.95);
            padding:12px 24px;
            border-radius:30px;
            z-index:10000;
            border:1px solid rgba(236,72,153,0.3);
            font-size:13px;
            opacity:0;
            transition:opacity 0.3s;
            pointer-events:none;
            white-space:nowrap;
            box-shadow:0 8px 32px rgba(0,0,0,0.4);
        }
        .toast-msg.show{
            opacity:1;
        }

        /* ✅ EMPTY STATE */
        .empty-state{
            text-align:center;
            padding:40px 20px;
            opacity:0.5;
        }
        .empty-state i{
            font-size:48px;
            color:#ec4899;
            margin-bottom:12px;
            display:block;
        }

        /* ✅ LOADER */
        .loader{
            display:flex;
            align-items:center;
            justify-content:center;
            flex:1;
            flex-direction:column;
            gap:12px;
            color:rgba(255,255,255,0.5);
        }
        .spinner{
            width:36px;height:36px;
            border:3px solid rgba(236,72,153,0.2);
            border-top-color:#ec4899;
            border-radius:50%;
            animation:spin 0.7s linear infinite;
        }
        @keyframes spin{
            to{transform:rotate(360deg)}
        }
    </style>
</head>
<body>

<!-- ✅ LOADER -->
<div id="loader" class="loader">
    <div class="spinner"></div>
    <span>💖 تحميل المحادثات...</span>
</div>

<!-- ✅ قائمة المحادثات -->
<div id="convView" style="display:none;flex:1;flex-direction:column;overflow:hidden">
    <div class="header">
        <button class="btn-back" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-right"></i>
        </button>
        <h2 style="font-size:18px;font-weight:700;">💖 المحادثات</h2>
    </div>
    <div id="convList" style="flex:1;overflow-y:auto;"></div>
</div>

<!-- ✅ واجهة الدردشة -->
<div id="chatView" style="display:none;flex:1;flex-direction:column;overflow:hidden">
    <!-- الهيدر -->
    <div class="header">
        <button class="btn-back" onclick="showConvs()">
            <i class="fas fa-arrow-right"></i>
        </button>
        <div class="chat-avatar" id="chatAvatar">
            <img src="" alt="avatar">
        </div>
        <div class="chat-info">
            <h3 id="chatName">محادثة</h3>
            <div class="status" id="chatOnline">
                <span class="online-indicator"></span> نشط الآن
            </div>
        </div>
    </div>

    <!-- منطقة الرسائل -->
    <div class="messages-area" id="msgsList">
        <div class="empty-state">
            <i class="fas fa-comments"></i>
            <p>ابدأ المحادثة الآن 💖</p>
        </div>
    </div>

    <!-- ✅ معاينة الصورة قبل الإرسال -->
    <div class="image-preview-bar" id="imagePreviewBar">
        <img id="previewImage" src="" alt="معاينة">
        <div class="preview-info">معاينة الصورة</div>
        <button class="btn-cancel-preview" onclick="cancelImagePreview()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- ✅ شريط الإدخال - مستطيل الكتابة -->
    <div class="input-container">
        <div class="input-row">
            <!-- زر التسجيل الصوتي -->
            <button class="btn-voice" id="btnVoice" onclick="toggleVoiceRecording()" title="تسجيل صوتي">
                <i class="fas fa-microphone"></i>
                <span class="recording-timer" id="recordingTimer">00:00</span>
            </button>

            <!-- مستطيل الكتابة -->
            <input 
                type="text" 
                class="message-input" 
                id="msgInput" 
                placeholder="💬 اكتب رسالتك هنا..."
                onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMsg();}"
            >

            <!-- زر إرسال الصور -->
            <button class="btn-image" onclick="selectImage()" title="إرسال صورة">
                <i class="fas fa-image"></i>
            </button>

            <!-- زر الإرسال -->
            <button class="btn-send" onclick="sendMsg()" title="إرسال">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<!-- ✅ TOAST -->
<div class="toast-msg" id="toastMsg">✅ تم</div>

<!-- ✅ Hidden file inputs -->
<input type="file" id="imageInput" accept="image/*" style="display:none" onchange="onImageSelected(this)">

<script src="firebase-config.js"></script>
<script>
    // ═══════════════════════════════════════
    // ✅ المتغيرات العامة
    // ═══════════════════════════════════════
    let currentUser = null;
    let allUsers = {};
    let chatUserId = null;
    let selectedImageFile = null;
    
    // ✅ التسجيل الصوتي
    let mediaRecorder = null;
    let audioChunks = [];
    let recordingStartTime = null;
    let recordingTimerInterval = null;
    let isRecording = false;

    // ═══════════════════════════════════════
    // ✅ التحقق من تسجيل الدخول
    // ═══════════════════════════════════════
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'auth.html';
            return;
        }
        currentUser = user;
        
        // تحميل جميع المستخدمين
        const usersSnap = await db.ref('users').once('value');
        allUsers = usersSnap.val() || {};
        
        document.getElementById('loader').style.display = 'none';
        
        // التحقق من وجود مستخدم محدد في الرابط
        const params = new URLSearchParams(window.location.search);
        const targetUid = params.get('uid');
        
        if (targetUid) {
            openChat(targetUid);
        } else {
            showConvs();
        }
        
        // تحديث حالة النشاط
        setInterval(() => {
            if (currentUser) {
                db.ref('users/' + currentUser.uid + '/lastSeen').set(Date.now());
            }
        }, 60000);
    });

    // ═══════════════════════════════════════
    // ✅ عرض قائمة المحادثات
    // ═══════════════════════════════════════
    function showConvs() {
        document.getElementById('chatView').style.display = 'none';
        document.getElementById('convView').style.display = 'flex';
        chatUserId = null;
        loadConvs();
    }

    async function loadConvs() {
        const convList = document.getElementById('convList');
        convList.innerHTML = '<div class="spinner" style="margin:40px auto"></div>';
        
        const snap = await db.ref('private_messages').once('value');
        const all = snap.val() || {};
        const found = new Set();
        
        Object.keys(all).forEach(chatId => {
            const [u1, u2] = chatId.split('_');
            const other = u1 === currentUser.uid ? u2 : (u2 === currentUser.uid ? u1 : null);
            if (other && !found.has(other) && allUsers[other]) {
                found.add(other);
            }
        });
        
        if (!found.size) {
            convList.innerHTML = `
                <div class="empty-state" style="padding:60px 20px">
                    <i class="fas fa-envelope-open-text"></i>
                    <p>لا توجد محادثات بعد</p>
                    <p style="font-size:12px;margin-top:4px;opacity:0.5">ابدأ محادثة من الملف الشخصي لأي مستخدم</p>
                </div>`;
            return;
        }
        
        convList.innerHTML = '';
        found.forEach(uid => {
            const user = allUsers[uid];
            const div = document.createElement('div');
            div.className = 'conv-item';
            div.innerHTML = `
                <div class="conv-avatar">
                    <img src="${user?.avatarUrl || (DICEBEAR_URL + '?seed=' + uid)}" alt="avatar">
                </div>
                <div class="conv-info">
                    <h4>@${user?.username || 'مستخدم'} ${user?.isVerified ? '<span style="color:#fbcfe8;font-size:10px"><i class="fas fa-check-circle"></i></span>' : ''}</h4>
                    <p>اضغط للدخول إلى المحادثة</p>
                </div>
                <i class="fas fa-chevron-left" style="opacity:0.3"></i>
            `;
            div.onclick = () => openChat(uid);
            convList.appendChild(div);
        });
    }

    // ═══════════════════════════════════════
    // ✅ فتح محادثة
    // ═══════════════════════════════════════
    async function openChat(uid) {
        chatUserId = uid;
        const user = allUsers[uid];
        
        document.getElementById('chatName').innerText = '@' + (user?.username || 'مستخدم');
        document.getElementById('chatAvatar').innerHTML = `<img src="${user?.avatarUrl || (DICEBEAR_URL + '?seed=' + uid)}" alt="avatar">`;
        
        document.getElementById('convView').style.display = 'none';
        document.getElementById('chatView').style.display = 'flex';
        
        // مراقبة حالة الاتصال
        db.ref('presence/' + uid).on('value', (snap) => {
            const online = snap.val();
            const statusEl = document.getElementById('chatOnline');
            if (statusEl) {
                statusEl.innerHTML = online 
                    ? '<span class="online-indicator"></span> نشط الآن'
                    : 'آخر ظهور: ' + formatTime(user?.lastSeen);
            }
        });
        
        // إعادة تعيين شريط الإدخال
        document.getElementById('msgInput').value = '';
        cancelImagePreview();
        
        await loadMessages();
        
        // تركيز على حقل الكتابة
        setTimeout(() => {
            document.getElementById('msgInput').focus();
        }, 300);
    }

    function getChatId() {
        return [currentUser.uid, chatUserId].sort().join('_');
    }

    // ═══════════════════════════════════════
    // ✅ تحميل الرسائل
    // ═══════════════════════════════════════
    async function loadMessages() {
        const msgsList = document.getElementById('msgsList');
        msgsList.innerHTML = '<div class="spinner" style="margin:40px auto"></div>';
        
        if (!chatUserId) return;
        
        const snap = await db.ref('private_messages/' + getChatId()).once('value');
        const messages = snap.val() || {};
        const msgsArray = Object.values(messages).sort((a, b) => a.timestamp - b.timestamp);
        
        if (!msgsArray.length) {
            msgsList.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-comments"></i>
                    <p>ابدأ المحادثة الآن 💖</p>
                </div>`;
            return;
        }
        
        msgsList.innerHTML = '';
        msgsArray.forEach(msg => {
            appendMessage(msg, false);
        });
        
        // تمرير للأسفل
        msgsList.scrollTop = msgsList.scrollHeight;
    }

    // ═══════════════════════════════════════
    // ✅ إضافة رسالة للعرض
    // ═══════════════════════════════════════
    function appendMessage(msg, scrollToBottom = true) {
        const msgsList = document.getElementById('msgsList');
        const isSent = msg.senderId === currentUser.uid;
        
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${isSent ? 'sent' : 'received'}`;
        
        let contentHTML = '';
        
        if (msg.type === 'image') {
            contentHTML = `<img src="${msg.imageUrl}" onclick="previewImage('${msg.imageUrl}')" alt="صورة">`;
        } else if (msg.type === 'voice') {
            contentHTML = `
                <div class="voice-msg">
                    <i class="fas fa-play" style="color:#ec4899;cursor:pointer;font-size:20px" onclick="this.nextElementSibling.play()"></i>
                    <audio src="${msg.voiceUrl}" preload="auto"></audio>
                    <span class="voice-duration">🎤 ${msg.duration || '0'}s</span>
                </div>`;
        } else {
            contentHTML = msg.text;
        }
        
        wrapper.innerHTML = `
            <div class="bubble ${isSent ? 'sent' : 'received'}">
                ${contentHTML}
                <div class="time">${new Date(msg.timestamp).toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'})}</div>
            </div>`;
        
        // إزالة حالة الفراغ إذا كانت موجودة
        const emptyState = msgsList.querySelector('.empty-state');
        if (emptyState) emptyState.remove();
        
        msgsList.appendChild(wrapper);
        
        if (scrollToBottom) {
            msgsList.scrollTop = msgsList.scrollHeight;
        }
    }

    // ═══════════════════════════════════════
    // ✅ إرسال رسالة نصية
    // ═══════════════════════════════════════
    async function sendMsg() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        
        if (!text || !chatUserId) return;
        
        const msgData = {
            senderId: currentUser.uid,
            text: text,
            type: 'text',
            timestamp: Date.now()
        };
        
        try {
            await db.ref('private_messages/' + getChatId()).push(msgData);
            input.value = '';
            input.focus();
            await loadMessages();
        } catch (error) {
            showToast('❌ فشل إرسال الرسالة');
            console.error(error);
        }
    }

    // ═══════════════════════════════════════
    // ✅ إرسال صورة
    // ═══════════════════════════════════════
    function selectImage() {
        document.getElementById('imageInput').click();
    }

    function onImageSelected(input) {
        const file = input.files[0];
        if (!file) return;
        
        if (!file.type.startsWith('image/')) {
            showToast('❌ الرجاء اختيار ملف صورة');
            return;
        }
        
        selectedImageFile = file;
        
        // عرض معاينة
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('previewImage').src = e.target.result;
            document.getElementById('imagePreviewBar').classList.add('show');
        };
        reader.readAsDataURL(file);
        
        // إرسال تلقائي بعد المعاينة
        sendImage();
    }

    function cancelImagePreview() {
        selectedImageFile = null;
        document.getElementById('imagePreviewBar').classList.remove('show');
        document.getElementById('previewImage').src = '';
        document.getElementById('imageInput').value = '';
    }

    async function sendImage() {
        if (!selectedImageFile || !chatUserId) return;
        
        showToast('⏳ جاري رفع الصورة...');
        
        const formData = new FormData();
        formData.append('file', selectedImageFile);
        formData.append('upload_preset', UPLOAD_PRESET);
        
        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            if (data.secure_url) {
                await db.ref('private_messages/' + getChatId()).push({
                    senderId: currentUser.uid,
                    type: 'image',
                    imageUrl: data.secure_url,
                    timestamp: Date.now()
                });
                
                cancelImagePreview();
                await loadMessages();
                showToast('✅ تم إرسال الصورة');
            } else {
                showToast('❌ فشل رفع الصورة');
            }
        } catch (error) {
            showToast('❌ خطأ في رفع الصورة');
            console.error(error);
        }
    }

    // ═══════════════════════════════════════
    // ✅ التسجيل الصوتي
    // ═══════════════════════════════════════
    async function toggleVoiceRecording() {
        const btnVoice = document.getElementById('btnVoice');
        
        if (isRecording) {
            // إيقاف التسجيل
            stopRecording();
        } else {
            // بدء التسجيل
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    // إيقاف جميع المسارات
                    stream.getTracks().forEach(track => track.stop());
                    
                    // إنشاء ملف صوتي
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await uploadVoiceMessage(audioBlob);
                };
                
                mediaRecorder.start();
                isRecording = true;
                recordingStartTime = Date.now();
                
                // تحديث واجهة التسجيل
                btnVoice.classList.add('recording');
                btnVoice.innerHTML = '<i class="fas fa-stop"></i><span class="recording-timer" id="recordingTimer">00:00</span>';
                
                // بدء المؤقت
                startRecordingTimer();
                
                showToast('🎤 جاري التسجيل...');
            } catch (error) {
                showToast('❌ لا يمكن الوصول للميكروفون');
                console.error(error);
            }
        }
    }

    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            stopRecordingTimer();
            
            const btnVoice = document.getElementById('btnVoice');
            btnVoice.classList.remove('recording');
            btnVoice.innerHTML = '<i class="fas fa-microphone"></i><span class="recording-timer" id="recordingTimer">00:00</span>';
        }
    }

    function startRecordingTimer() {
        recordingTimerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            const timerEl = document.getElementById('recordingTimer');
            if (timerEl) {
                timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
            
            // إيقاف تلقائي بعد 5 دقائق
            if (elapsed >= 300) {
                stopRecording();
            }
        }, 1000);
    }

    function stopRecordingTimer() {
        if (recordingTimerInterval) {
            clearInterval(recordingTimerInterval);
            recordingTimerInterval = null;
        }
    }

    async function uploadVoiceMessage(audioBlob) {
        if (!chatUserId) return;
        
        showToast('⏳ جاري رفع التسجيل الصوتي...');
        
        const formData = new FormData();
        formData.append('file', audioBlob, 'voice-message.webm');
        formData.append('upload_preset', UPLOAD_PRESET);
        formData.append('resource_type', 'video'); // Cloudinary يعامل الصوت كفيديو
        
        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            if (data.secure_url) {
                const duration = Math.floor((Date.now() - recordingStartTime) / 1000);
                
                await db.ref('private_messages/' + getChatId()).push({
                    senderId: currentUser.uid,
                    type: 'voice',
                    voiceUrl: data.secure_url,
                    duration: duration,
                    timestamp: Date.now()
                });
                
                await loadMessages();
                showToast('✅ تم إرسال التسجيل الصوتي');
            } else {
                showToast('❌ فشل رفع التسجيل');
            }
        } catch (error) {
            showToast('❌ خطأ في رفع التسجيل');
            console.error(error);
        }
    }

    // ═══════════════════════════════════════
    // ✅ معاينة الصورة
    // ═══════════════════════════════════════
    function previewImage(url) {
        const overlay = document.createElement('div');
        overlay.className = 'image-preview-overlay';
        overlay.innerHTML = `<img src="${url}" alt="معاينة">`;
        overlay.onclick = () => overlay.remove();
        document.body.appendChild(overlay);
    }

    // ═══════════════════════════════════════
    // ✅ نسخ المحادثة
    // ═══════════════════════════════════════
    async function copyChat() {
        if (!chatUserId) return;
        
        const snap = await db.ref('private_messages/' + getChatId()).once('value');
        const msgs = snap.val() || {};
        let text = '💬 محادثة MNAENCA\n' + '─'.repeat(30) + '\n';
        
        Object.values(msgs).sort((a, b) => a.timestamp - b.timestamp).forEach(msg => {
            const sender = msg.senderId === currentUser.uid ? 'أنت' : (allUsers[msg.senderId]?.username || 'مستخدم');
            let content = '';
            
            if (msg.type === 'image') content = '[صورة]';
            else if (msg.type === 'voice') content = '[رسالة صوتية]';
            else content = msg.text;
            
            const time = new Date(msg.timestamp).toLocaleTimeString('ar-SA');
            text += `\n${sender} (${time}):\n${content}\n`;
        });
        
        try {
            await navigator.clipboard.writeText(text);
            showToast('✅ تم نسخ المحادثة');
        } catch (e) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('✅ تم نسخ المحادثة');
        }
    }

    // ═══════════════════════════════════════
    // ✅ دوال مساعدة
    // ═══════════════════════════════════════
    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function formatTime(timestamp) {
        if (!timestamp) return 'غير معروف';
        const diff = Date.now() - timestamp;
        const mins = Math.floor(diff / 60000);
        const hours = Math.floor(diff / 3600000);
        const days = Math.floor(diff / 86400000);
        
        if (mins < 1) return 'الآن';
        if (mins < 60) return 'منذ ' + mins + ' دقيقة';
        if (hours < 24) return 'منذ ' + hours + ' ساعة';
        if (days < 7) return 'منذ ' + days + ' يوم';
        return new Date(timestamp).toLocaleDateString('ar-SA');
    }

    // ✅ تعريض الدوال للاستخدام العام
    window.showConvs = showConvs;
    window.sendMsg = sendMsg;
    window.selectImage = selectImage;
    window.cancelImagePreview = cancelImagePreview;
    window.toggleVoiceRecording = toggleVoiceRecording;
    window.previewImage = previewImage;
    window.copyChat = copyChat;

    console.log('💖 MNAENCA Chat Ready - Voice + Image Support ✨');
</script>
